  <style>
    :root{--bg:#f5f3ee;--surface:#eceae3;--text:#1a1916;--muted:#6b6860;--accent:#C96A00;--accent-lt:#FEF0DE;--border:rgba(0,0,0,0.08);--nav-bg:rgba(245,243,238,0.72);--card-bg:#ffffff;--shadow:0 2px 24px rgba(0,0,0,0.08);}
    
    @media(prefers-color-scheme:dark){
      :root{--bg:#111210;--surface:#1c1d1a;--text:#e8e6df;--muted:#8a8880;--accent:#F0922B;--accent-lt:#261600;--border:rgba(255,255,255,0.08);--nav-bg:rgba(17,18,16,0.72);--card-bg:#1c1d1a;--shadow:0 2px 24px rgba(0,0,0,0.4);}
      
      /* UPDATED: In dark mode, restore container background to blend with the dimmed iframe */
      .sheet-container {
        background: var(--card-bg) !important;
        border: 0.5px solid var(--border) !important;
        box-shadow: var(--shadow) !important;
      }
      /* UPDATED: Disable multiply and dim the white background instead */
      .sheet-container iframe {
        mix-blend-mode: normal !important;
        opacity: 0.88;
      }
    }
    
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.7;}
    
    nav{
      position:fixed;top:16px;left:50%;transform:translateX(-50%);
      width:min(820px,calc(100% - 32px));
      padding:0 22px;height:52px;display:flex;align-items:center;justify-content:space-between;
      z-index:100;
    }
    nav::before{
      content:'';position:absolute;inset:0;
      background:var(--nav-bg);
      backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);
      border:0.5px solid var(--border);border-radius:999px;
      box-shadow:var(--shadow);z-index:-1;
    }
    .nav-logo{font-family:'Instrument Serif',serif;font-size:17px;color:var(--text);text-decoration:none;letter-spacing:-0.02em;white-space:nowrap;}
    .nav-center{display:flex;gap:2px;list-style:none;align-items:center;}
    .nav-center>li>a{text-decoration:none;font-size:13px;color:var(--muted);padding:6px 12px;border-radius:999px;transition:background .15s,color .15s;cursor:pointer;display:flex;align-items:center;gap:4px;}
    .nav-center>li>a:hover{background:var(--surface);color:var(--text);}
    .has-dropdown{position:relative;}
    .chevron{font-size:9px;transition:transform .2s;display:inline-block;margin-top:1px;}
    .has-dropdown.open .chevron{transform:rotate(180deg);}
    
    .dropdown-menu{
      position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);
      background:var(--nav-bg);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);
      border:0.5px solid var(--border);border-radius:20px;padding:12px;
      min-width:190px;display:none;flex-direction:column;gap:6px;box-shadow:var(--shadow);
    }
    .has-dropdown.open .dropdown-menu{display:flex;}
    .dropdown-menu a{padding:12px 16px;border-radius:12px;font-size:14px;color:var(--muted);text-decoration:none;transition:background .15s,color .15s;display:flex;align-items:center;gap:12px;white-space:nowrap;}
    .dropdown-menu a:hover{background:var(--surface);color:var(--text);}
    
    .lang-switcher{display:flex;background:var(--surface);padding:2px;border-radius:999px;}
    .lang-btn{border:none;background:none;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;cursor:pointer;color:var(--muted);transition:all .2s;}
    .lang-btn.active{background:var(--card-bg);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.05);}
    
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .mobile-menu-btn { display: none; background: none; border: none; font-size: 16px; color: var(--text); cursor: pointer; padding: 4px; }
    
    @media(max-width:650px){
      .mobile-menu-btn { display: block; }
      .nav-center {
        display: none;
        position: absolute; top: calc(100% + 12px); left: 0; right: 0;
        background: var(--nav-bg); backdrop-filter: blur(22px) saturate(1.7); -webkit-backdrop-filter: blur(22px) saturate(1.7);
        border: 0.5px solid var(--border); border-radius: 20px; padding: 12px;
        flex-direction: column; box-shadow: var(--shadow);
      }
      .nav-center.open { display: flex; }
      .nav-center > li { width: 100%; }
      .nav-center > li > a { width: 100%; justify-content: space-between; padding: 12px 16px; font-size: 14px; border-radius: 12px; }
      .dropdown-menu { position: relative; top: 0; left: 0; transform: none; box-shadow: none; border: none; background: transparent; padding: 0 0 0 16px; display: none; min-width: auto; }
      .has-dropdown.open .dropdown-menu { display: flex; }
    }

    main{max-width:820px;margin:0 auto;padding:120px 24px 40px;height:100vh;display:flex;flex-direction:column;}
    h1{font-family:'Instrument Serif',serif;font-size:clamp(48px,8vw,80px);line-height:1.08;letter-spacing:-.03em;text-align:center;margin-bottom:48px;color:var(--accent);}
    h1 a{color:var(--accent);text-decoration:none;transition:opacity .2s;}
    h1 a:hover{opacity:0.8;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:8px;}
    h1 em{font-style:italic;}

    /* UPDATED: Removed background and borders so the light mode multiply effect works cleanly */
    .sheet-container{flex-grow:1;border-radius:16px;overflow:hidden;background:transparent;}
    
    /* UPDATED: Added mix-blend-mode for light mode to absorb the site's background */
    iframe{width:100%;height:100%;border:none;mix-blend-mode:multiply;transition:opacity 0.3s, mix-blend-mode 0.3s;}
  </style>

<body>

<nav>
  <a class="nav-logo" href="index.html">Thales Catão</a>
  <ul class="nav-center" id="nav-center">
    <li><a href="index.html#portfolio" data-k="nav.portfolio">Portfólio</a></li>
    <li class="has-dropdown" id="dd-item">
      <a id="dd-btn" tabindex="0">
        <span data-k="nav.personal">Pessoal</span>
        <span class="chevron">▾</span>
      </a>
      <div class="dropdown-menu">
        <a href="workout.html">🏋️ <span data-k="nav.workout">Treino</span></a>
        <a href="nutrition.html">🥗 <span data-k="nav.nutrition">Nutrição</span></a>
        <a href="music-theory.html">🎵 <span data-k="nav.music">Teoria Musical</span></a>
      </div>
    </li>
    <li><a href="contact.html" data-k="nav.contact">Contato</a></li>
  </ul>
  <div class="nav-right">
    <div class="lang-switcher">
      <button class="lang-btn" id="btn-pt" onclick="setLang('pt')">PT</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  </div>
</nav>

<main>
  <h1><a href="https://docs.google.com/spreadsheets/d/1Cr8rtkV16nPg4lQG0IPQZtXupl4YBRWKTyVRk7h_J_s/view" target="_blank" rel="noopener"><em data-k="title">Treino</em></a></h1>
  <div class="sheet-container">
    <iframe src="https://docs.google.com/spreadsheets/d/1Cr8rtkV16nPg4lQG0IPQZtXupl4YBRWKTyVRk7h_J_s/preview"></iframe>
  </div>
</main>

<script>
const translations = {
  pt: {
    'nav.portfolio': 'Portfólio', 'nav.personal': 'Pessoal', 'nav.contact': 'Contato',
    'nav.workout': 'Treino', 'nav.nutrition': 'Nutrição', 'nav.music': 'Teoria Musical',
    'title': 'Treino'
  },
  en: {
    'nav.portfolio': 'Portfolio', 'nav.personal': 'Personal', 'nav.contact': 'Contact',
    'nav.workout': 'Workout', 'nav.nutrition': 'Nutrition', 'nav.music': 'Music Theory',
    'title': 'Workout'
  }
};

function setLang(lang) {
  try { localStorage.setItem('siteLang', lang); } catch(e) {}
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';

  document.getElementById('btn-pt')?.classList.toggle('active', lang === 'pt');
  document.getElementById('btn-en')?.classList.toggle('active', lang === 'en');
  
  document.querySelectorAll('[data-k]').forEach(el => {
    const key = el.getAttribute('data-k');
    if (translations[lang] && translations[lang][key]) {
      el.innerHTML = translations[lang][key];
    }
  });
}

// Navigation Events
const ddItem = document.getElementById('dd-item');
const ddBtn = document.getElementById('dd-btn');
const navCenter = document.getElementById('nav-center');
const mobileBtn = document.getElementById('mobile-menu-btn');

mobileBtn?.addEventListener('click', e => {
  e.stopPropagation();
  navCenter.classList.toggle('open');
});

ddBtn?.addEventListener('click', e => {
  e.stopPropagation(); e.preventDefault();
  ddItem.classList.toggle('open');
});

document.addEventListener('click', e => {
  if (ddItem && !ddItem.contains(e.target)) ddItem.classList.remove('open');
  if (navCenter && !navCenter.contains(e.target) && mobileBtn && !mobileBtn.contains(e.target)) {
    navCenter.classList.remove('open');
  }
});

// Initialization
const savedLang = (() => { try { return localStorage.getItem('siteLang') || 'pt'; } catch(e) { return 'pt'; } })();
setLang(savedLang);
</script>
</body>
