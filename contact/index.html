  <style>
    :root {
      --glass-blur: blur(20px);
      --hold-text-filling: var(--text);
      --body-pb: 84px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --hold-text-filling: var(--text);
        --body-pb: 84px;
      }
    }

    /* Mobile Performance Tuning: Bypass backdrop-filter on small screens to eliminate pinch-to-zoom latency */
    @media (max-width: 650px) {
      :root {
        --glass-blur: none;
      }

      .social-card,
      .hold-btn,
      .reveal-card {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 110px 24px 40px;
    }

    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(48px, 8vw, 80px);
      line-height: 1.08;
      letter-spacing: -.03em;
      text-align: center;
      margin-bottom: 56px;
      color: var(--accent);
    }

    h1 em {
      font-style: italic;
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 56px;
    }

    .social-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 0.5px solid var(--glass-border);
      border-radius: 16px;
      padding: 18px 20px;
      text-decoration: none;
      color: var(--text);
      transition: transform .2s, border-color .2s, background-color .2s;
    }

    .social-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      background: var(--glass-bg-hover);
    }

    .social-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-lt);
      color: var(--accent);
      font-size: 18px;
      flex-shrink: 0;
    }

    .social-info .name {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.2;
    }

    .social-info .handle {
      font-size: 12px;
      color: var(--muted);
    }

    .verification-section {
      margin-bottom: 24px;
      text-align: center;
    }

    .verification-section>p.intro {
      font-size: 15px;
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 24px;
    }

    .hold-btn {
      position: relative;
      overflow: hidden;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 0.5px solid var(--glass-border);
      color: var(--text);
      padding: 18px 36px;
      border-radius: 999px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      outline: none;
      transition: transform 0.2s, background-color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 260px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .hold-btn:hover {
      background: var(--glass-bg-hover);
    }

    .hold-btn:active {
      transform: scale(0.97);
    }

    .hold-bg {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: var(--accent);
      z-index: 1;
    }

    .hold-text {
      position: relative;
      z-index: 2;
      transition: color 0.2s;
      pointer-events: none;
    }

    .hold-btn.filling .hold-text {
      color: var(--hold-text-filling);
    }

    .hold-btn.success {
      background: var(--accent);
      color: var(--on-accent);
      border-color: var(--accent);
      cursor: default;
      transform: none;
    }

    .hold-btn.success .hold-text {
      color: var(--on-accent);
    }

    .hold-btn.success .hold-bg {
      display: none;
    }

    .contact-revealed {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }

    #dynamic-contacts {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .reveal-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: color-mix(in srgb, var(--accent-lt) 55%, transparent);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 0.5px solid var(--accent);
      border-radius: 16px;
      padding: 18px 22px;
      text-decoration: none;
      color: var(--text);
      transition: transform .2s, border-color .2s, background-color .2s;
    }

    .reveal-card:hover {
      transform: translateY(-3px);
      background: color-mix(in srgb, var(--accent-lt) 75%, transparent);
    }

    @media (prefers-color-scheme: dark) {
      .reveal-card {
        background: color-mix(in srgb, var(--accent-lt) 65%, transparent);
      }
      .reveal-card:hover {
        background: color-mix(in srgb, var(--accent-lt) 80%, transparent);
      }
    }

    .reveal-card i {
      font-size: 20px;
      color: var(--accent);
    }

    .reveal-card .info .label {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .05em;
      text-align: left;
    }

    .reveal-card .info .val {
      font-size: 15px;
      font-weight: 500;
    }

    .success-msg {
      font-size: 14px;
      color: var(--accent);
      font-weight: 500;
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    footer {
      padding: 40px 24px;
    }

    h1 {
      animation: fadeUp .4s ease both;
    }

    .social-grid {
      animation: fadeUp .4s .1s ease both;
    }
  </style>

  <script>
    let currentLang = 'pt';
    let isSuccess = false;

    window.pageTranslations = {
      pt: {
        'title': '<em>Contato</em>',
        'verify.intro': 'Para evitar spam, confirme que é humano pressionando o botão abaixo até o fim.',
        'btn.hold': 'Segure para revelar', 'btn.verified': 'Verificado!',
        'success.msg': '✅ Humano verificado! Aqui estão meus contatos:',
        'label.email': 'E-mail', 'label.whatsapp': 'WhatsApp'
      },
      en: {
        'title': '<em>Contact</em>',
        'verify.intro': 'To prevent spam, confirm humanness by pressing the button below until the end.',
        'btn.hold': 'Hold to reveal', 'btn.verified': 'Verified!',
        'success.msg': '✅ Human verified! Here is my direct contact info:',
        'label.email': 'Email', 'label.whatsapp': 'WhatsApp'
      }
    };

    window.onLangChange = function (lang) {
      currentLang = lang;
      const holdText = document.getElementById('hold-text');
      if (holdText) {
        holdText.innerHTML = isSuccess
          ? window.pageTranslations[lang]['btn.verified']
          : window.pageTranslations[lang]['btn.hold'];
      }
      if (isSuccess) renderContacts();
    };

    // Encoded Data
    const encEmail = "dGhhbGVzLmNmbUBnbWFpbC5jb20=";
    const encPhoneLink = "NTUzMTk5Njc1MTA3OQ==";
    const encPhoneShow = "KzU1ICgzMSkgOTk2NzUtMTA3OQ==";

    function renderContacts() {
      const container = document.getElementById('dynamic-contacts');
      if (!container) return;
      const decEmail = atob(encEmail);
      const decPhoneLink = atob(encPhoneLink);
      const decPhoneShow = atob(encPhoneShow);
      container.innerHTML = `
    <a class="reveal-card" href="mailto:${decEmail}">
      <i class="fa-solid fa-envelope"></i>
      <div class="info"><div class="label">${window.pageTranslations[currentLang]['label.email']}</div><div class="val">${decEmail}</div></div>
    </a>
    <a class="reveal-card" href="https://api.whatsapp.com/send/?phone=${decPhoneLink}" target="_blank" rel="noopener">
      <i class="fa-brands fa-whatsapp"></i>
      <div class="info"><div class="label">${window.pageTranslations[currentLang]['label.whatsapp']}</div><div class="val">${decPhoneShow}</div></div>
    </a>`;
    }

    // Hold to verify logic
    const holdBtn = document.getElementById('hold-btn');
    const holdBg = document.getElementById('hold-bg');
    const holdText = document.getElementById('hold-text');
    const wrap = document.getElementById('verification-wrap');
    const revealed = document.getElementById('contact-revealed');
    const successMsg = document.getElementById('success-msg');

    let holdTimer;
    let progress = 0;
    let lastTime = 0;

    function startHold(e) {
      if (e.type === 'touchstart') e.preventDefault();
      if (isSuccess) return;
      holdBtn.classList.add('filling');
      lastTime = performance.now();
      if (!holdTimer) holdTimer = requestAnimationFrame(fill);
    }

    function fill(time) {
      if (!holdBtn.classList.contains('filling')) { holdTimer = null; return; }
      let deltaTime = time - lastTime;
      lastTime = time;
      progress += deltaTime * 0.013;
      if (progress >= 100) {
        progress = 100;
        if (holdBg) holdBg.style.width = '100%';
        success();
        holdTimer = null;
        return;
      }
      if (holdBg) holdBg.style.width = progress + '%';
      holdTimer = requestAnimationFrame(fill);
    }

    function stopHold() {
      if (isSuccess) return;
      holdBtn.classList.remove('filling');
      progress = 0;
      if (holdBg) holdBg.style.width = '0%';
    }

    function success() {
      isSuccess = true;
      holdBtn.classList.remove('filling');
      holdBtn.classList.add('success');
      if (holdText) holdText.innerHTML = window.pageTranslations[currentLang]['btn.verified'];
      setTimeout(() => {
        if (wrap) wrap.style.display = 'none';
        if (revealed) {
          if (successMsg) successMsg.innerHTML = window.pageTranslations[currentLang]['success.msg'];
          renderContacts();
          revealed.style.display = 'flex';
        }
      }, 400);
    }

    if (holdBtn) {
      holdBtn.addEventListener('mousedown', startHold);
      holdBtn.addEventListener('touchstart', startHold, { passive: false });
    }
    window.addEventListener('mouseup', stopHold);
    window.addEventListener('touchend', stopHold);
    window.addEventListener('touchcancel', stopHold);
    window.addEventListener('mouseleave', stopHold);
  </script>

</body>
