  <style>
    :root {
      --bg: #f5f3ee;
      --surface: #eceae3;
      --text: #1a1916;
      --muted: #6b6860;
      --accent: #C96A00;
      --accent-lt: #FEF0DE;
      --border: rgba(0, 0, 0, 0.08);
      --nav-bg: rgba(245, 243, 238, 0.72);
      --card-bg: #ffffff;
      --shadow: 0 2px 28px rgba(0, 0, 0, 0.08);
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg: #111210;
        --surface: #1c1d1a;
        --text: #e8e6df;
        --muted: #8a8880;
        --accent: #F0922B;
        --accent-lt: #261600;
        --border: rgba(255, 255, 255, 0.08);
        --nav-bg: rgba(17, 18, 16, 0.72);
        --card-bg: #1c1d1a;
        --shadow: 0 2px 28px rgba(0, 0, 0, 0.45);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.7;
    }

    nav {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(820px, calc(100% - 32px));
      padding: 0 22px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    nav::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--nav-bg);
      backdrop-filter: blur(22px) saturate(1.7);
      -webkit-backdrop-filter: blur(22px) saturate(1.7);
      border: 0.5px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow);
      z-index: -1;
    }

    .nav-logo {
      font-family: 'Instrument Serif', serif;
      font-size: 17px;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .nav-center {
      display: flex;
      gap: 2px;
      list-style: none;
      align-items: center;
    }

    .nav-center>li>a {
      text-decoration: none;
      font-size: 13px;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      transition: background .15s, color .15s;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-center>li>a:hover {
      background: var(--surface);
      color: var(--text);
    }

    .has-dropdown {
      position: relative;
    }

    .chevron {
      font-size: 9px;
      transition: transform .2s;
      display: inline-block;
      margin-top: 1px;
    }

    /* Specific selector to prevent "more" arrow from rotating when main dropdown opens */
    .has-dropdown.open>#dd-btn .chevron {
      transform: rotate(180deg);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--nav-bg);
      backdrop-filter: blur(22px) saturate(1.7);
      -webkit-backdrop-filter: blur(22px) saturate(1.7);
      border: 0.5px solid var(--border);
      border-radius: 20px;
      padding: 12px 12px 0 12px;
      min-width: 190px;
      display: none;
      flex-direction: column;
      gap: 6px;
      box-shadow: var(--shadow);
    }

    .has-dropdown.open .dropdown-menu {
      display: flex;
    }

    .dropdown-menu a {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      color: var(--muted);
      text-decoration: none;
      transition: background .15s, color .15s;
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .dropdown-menu a:hover {
      background: var(--surface);
      color: var(--text);
    }

    /* More Menu Styles inside Dropdown */
    .more-container {
      display: flex;
      flex-direction: column;
    }

    .more-menu {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 6px;
    }

    .more-container.open .more-menu {
      display: flex;
    }

    .more-toggle {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 -12px;
      height: 24px;
      cursor: pointer;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      color: var(--muted);
      transition: background .15s, color .15s;
    }

    .more-toggle:hover {
      background: var(--surface);
      color: var(--text);
    }

    .more-container.open .more-toggle .chevron {
      transform: rotate(180deg);
    }

    .lang-switcher {
      display: flex;
      background: var(--surface);
      padding: 2px;
      border-radius: 999px;
    }

    .lang-btn {
      border: none;
      background: none;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--muted);
      transition: all .2s;
    }

    .lang-btn.active {
      background: var(--card-bg);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mobile-menu-btn {
      display: none;
      position: relative;
      width: 28px;
      height: 28px;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 0;
    }

    .mobile-menu-btn span {
      position: absolute;
      left: 5px;
      width: 18px;
      height: 1.5px;
      background: currentColor;
      border-radius: 999px;
      transition: transform .22s ease, opacity .16s ease, top .22s ease;
    }

    .mobile-menu-btn span:nth-child(1) {
      top: 8px;
    }

    .mobile-menu-btn span:nth-child(2) {
      top: 13px;
    }

    .mobile-menu-btn span:nth-child(3) {
      top: 18px;
    }

    .mobile-menu-btn.active span:nth-child(1) {
      top: 13px;
      transform: rotate(45deg);
    }

    .mobile-menu-btn.active span:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }

    .mobile-menu-btn.active span:nth-child(3) {
      top: 13px;
      transform: rotate(-45deg);
    }

    @media(max-width:650px) {
      .mobile-menu-btn {
        display: block;
      }

      .nav-center {
        display: none;
        position: absolute;
        top: calc(100% + 12px);
        left: auto;
        right: 0;
        width: max-content;
        min-width: 190px;
        max-width: calc(100vw - 32px);
        background: var(--nav-bg);
        backdrop-filter: blur(22px) saturate(1.7);
        -webkit-backdrop-filter: blur(22px) saturate(1.7);
        border: 0.5px solid var(--border);
        border-radius: 20px;
        padding: 12px;
        flex-direction: column;
        align-items: stretch;
        box-shadow: var(--shadow);
      }

      .nav-center.open {
        display: flex;
      }

      .nav-center>li {
        width: 100%;
      }

      .nav-center>li>a {
        width: 100%;
        justify-content: space-between;
        padding: 12px 16px;
        font-size: 14px;
        border-radius: 12px;
      }

      .dropdown-menu {
        position: relative;
        top: 0;
        left: 0;
        transform: none;
        align-self: stretch;
        width: 100%;
        max-width: 100%;
        box-shadow: none;
        border: none;
        background: transparent;
        padding: 4px 0 0;
        display: none;
        min-width: 0;
        gap: 6px;
        align-items: stretch;
      }

      .dropdown-menu a {
        width: 100%;
        justify-content: flex-start;
      }

      .has-dropdown.open .dropdown-menu {
        display: flex;
      }

      .more-container {
        width: 100%;
      }

      .more-toggle {
        width: 100%;
        margin: 0;
        border-radius: 0 0 12px 12px;
        height: 24px;
        align-self: stretch;
      }
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 110px 24px 80px;
    }

    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(48px, 8vw, 80px);
      line-height: 1.08;
      letter-spacing: -.03em;
      text-align: center;
      margin-bottom: 56px;
      color: var(--accent);
    }

    h1 em {

    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 56px;
    }

    .social-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--card-bg);
      border: 0.5px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      text-decoration: none;
      color: var(--text);
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .social-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: var(--accent);
    }

    .social-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-lt);
      color: var(--accent);
      font-size: 18px;
      flex-shrink: 0;
    }

    .social-info .name {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.2;
    }

    .social-info .handle {
      font-size: 12px;
      color: var(--muted);
    }

    .verification-section {
      margin-bottom: 48px;
    }

    .verification-section>p.intro {
      font-size: 15px;
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 24px;
    }

    .hold-btn {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 0.5px solid var(--border);
      color: var(--text);
      padding: 18px 36px;
      border-radius: 999px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      outline: none;
      transition: transform 0.2s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 260px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .hold-btn:active {
      transform: scale(0.97);
    }

    .hold-bg {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: var(--accent);
      z-index: 1;
    }

    .hold-text {
      position: relative;
      z-index: 2;
      transition: color 0.2s;
      pointer-events: none;
    }

    .hold-btn.filling .hold-text {
      color: #fff;
    }

    .hold-btn.success {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      cursor: default;
      transform: none;
    }

    .hold-btn.success .hold-bg {
      display: none;
    }

    .contact-revealed {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }

    #dynamic-contacts {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .reveal-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--accent-lt);
      border: 0.5px solid var(--accent);
      border-radius: 16px;
      padding: 18px 22px;
      text-decoration: none;
      color: var(--text);
      transition: opacity .15s;
    }

    .reveal-card:hover {
      opacity: .85;
    }

    .reveal-card i {
      font-size: 20px;
      color: var(--accent);
    }

    .reveal-card .info .label {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .reveal-card .info .val {
      font-size: 15px;
      font-weight: 500;
    }

    .success-msg {
      font-size: 14px;
      color: var(--accent);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    footer {
      text-align: center;
      padding: 40px 24px;
      font-size: 13px;
      color: var(--muted);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      animation: fadeUp .4s ease both;
    }

    .social-grid {
      animation: fadeUp .4s .1s ease both;
    }

    .verification-section {
      animation: fadeUp .4s .2s ease both;
    }
  </style>
</head>

  <script>
    const translations = {
      pt: {
        'nav.portfolio': 'Portfólio', 'nav.personal': 'Pessoal', 'nav.contact': 'Contato',
        'nav.workout': 'Treino', 'nav.nutrition': 'Nutrição', 'nav.music': 'Teoria Musical',
        'nav.software': 'Software', 'nav.law': 'Direito Natural',
        'title': '<em>Contato</em>',
        'verify.intro': 'Para evitar spam, confirme que é humano pressionando e segurando o botão abaixo até o fim.',
        'btn.hold': 'Segure para revelar', 'btn.verified': 'Verificado!',
        'success.msg': '✅ Humano verificado! Aqui estão meus contatos diretos:',
        'label.email': 'E-mail', 'label.whatsapp': 'WhatsApp',
        'footer': 'Feito com 🧡 · © 2026 Thales Catão'
      },
      en: {
        'nav.portfolio': 'Portfolio', 'nav.personal': 'Personal', 'nav.contact': 'Contact',
        'nav.workout': 'Workout', 'nav.nutrition': 'Nutrition', 'nav.music': 'Music Theory',
        'nav.software': 'Software', 'nav.law': 'Natural Law',
        'title': '<em>Contact</em>',
        'verify.intro': 'To prevent spam, confirm humanness by pressing and holding the button below until the end.',
        'btn.hold': 'Hold to reveal', 'btn.verified': 'Verified!',
        'success.msg': '✅ Human verified! Here is my direct contact info:',
        'label.email': 'Email', 'label.whatsapp': 'WhatsApp',
        'footer': 'Built with 🧡 · © 2026 Thales Catão'
      }
    };

    let currentLang = 'pt';
    let isSuccess = false;

    function setLang(lang) {
      currentLang = lang;
      try { localStorage.setItem('siteLang', lang); } catch (e) { }
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';

      document.getElementById('btn-pt')?.classList.toggle('active', lang === 'pt');
      document.getElementById('btn-en')?.classList.toggle('active', lang === 'en');

      document.querySelectorAll('[data-k]').forEach(el => {
        const key = el.getAttribute('data-k');
        if (translations[lang] && translations[lang][key]) {
          el.innerHTML = translations[lang][key];
        }
      });

      const holdText = document.getElementById('hold-text');
      if (holdText) {
        holdText.innerHTML = isSuccess ? translations[lang]['btn.verified'] : translations[lang]['btn.hold'];
      }

      if (isSuccess) renderContacts();
    }

    // Navigation Events
    const ddItem = document.getElementById('dd-item');
    const ddBtn = document.getElementById('dd-btn');
    const navCenter = document.getElementById('nav-center');
    const mobileBtn = document.getElementById('mobile-menu-btn');
    const moreToggle = document.getElementById('more-toggle');
    const moreContainer = document.getElementById('more-container');

    mobileBtn?.addEventListener('click', e => {
      e.stopPropagation();
      const isOpen = navCenter.classList.toggle('open');
      mobileBtn.classList.toggle('active', isOpen);
      mobileBtn.setAttribute('aria-expanded', String(isOpen));
    });

    ddBtn?.addEventListener('click', e => {
      e.stopPropagation(); e.preventDefault();
      ddItem.classList.toggle('open');
    });

    moreToggle?.addEventListener('click', e => {
      e.stopPropagation(); e.preventDefault();
      moreContainer.classList.toggle('open');
    });

    document.addEventListener('click', e => {
      if (ddItem && !ddItem.contains(e.target)) {
        ddItem.classList.remove('open');
        moreContainer?.classList.remove('open');
      }
      if (navCenter && !navCenter.contains(e.target) && mobileBtn && !mobileBtn.contains(e.target)) {
        navCenter.classList.remove('open');
        mobileBtn.classList.remove('active');
        mobileBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // Encoded Data
    const encEmail = "dGhhbGVzLmNmbUBnbWFpbC5jb20=";
    const encPhoneLink = "NTUzMTk5Njc1MTA3OQ==";
    const encPhoneShow = "KzU1ICgzMSkgOTk2NzUtMTA3OQ==";

    function renderContacts() {
      const container = document.getElementById('dynamic-contacts');
      if (!container) return;

      const decEmail = atob(encEmail);
      const decPhoneLink = atob(encPhoneLink);
      const decPhoneShow = atob(encPhoneShow);

      container.innerHTML = `
    <a class="reveal-card" href="mailto:${decEmail}">
      <i class="fa-solid fa-envelope"></i>
      <div class="info"><div class="label">${translations[currentLang]['label.email']}</div><div class="val">${decEmail}</div></div>
    </a>
    <a class="reveal-card" href="https://api.whatsapp.com/send/?phone=${decPhoneLink}" target="_blank" rel="noopener">
      <i class="fa-brands fa-whatsapp"></i>
      <div class="info"><div class="label">${translations[currentLang]['label.whatsapp']}</div><div class="val">${decPhoneShow}</div></div>
    </a>
  `;
    }

    // Hold to verify logic
    const holdBtn = document.getElementById('hold-btn');
    const holdBg = document.getElementById('hold-bg');
    const holdText = document.getElementById('hold-text');
    const wrap = document.getElementById('verification-wrap');
    const revealed = document.getElementById('contact-revealed');
    const successMsg = document.getElementById('success-msg');

    let holdTimer;
    let progress = 0;
    let lastTime = 0;

    function startHold(e) {
      if (e.type === 'touchstart') e.preventDefault();
      if (isSuccess) return;
      holdBtn.classList.add('filling');
      lastTime = performance.now();
      if (!holdTimer) holdTimer = requestAnimationFrame(fill);
    }

    function fill(time) {
      if (!holdBtn.classList.contains('filling')) { holdTimer = null; return; }
      let deltaTime = time - lastTime;
      lastTime = time;
      progress += deltaTime * 0.013;
      if (progress >= 100) {
        progress = 100;
        if (holdBg) holdBg.style.width = '100%';
        success();
        holdTimer = null;
        return;
      }
      if (holdBg) holdBg.style.width = progress + '%';
      holdTimer = requestAnimationFrame(fill);
    }

    function stopHold() {
      if (isSuccess) return;
      holdBtn.classList.remove('filling');
      progress = 0;
      if (holdBg) holdBg.style.width = '0%';
    }

    function success() {
      isSuccess = true;
      holdBtn.classList.add('success');
      if (holdText) holdText.innerHTML = translations[currentLang]['btn.verified'];
      setTimeout(() => {
        if (wrap) wrap.style.display = 'none';
        if (revealed) {
          if (successMsg) successMsg.innerHTML = translations[currentLang]['success.msg'];
          renderContacts();
          revealed.style.display = 'flex';
        }
      }, 400);
    }

    if (holdBtn) {
      holdBtn.addEventListener('mousedown', startHold);
      holdBtn.addEventListener('touchstart', startHold, { passive: false });
    }

    window.addEventListener('mouseup', stopHold);
    window.addEventListener('touchend', stopHold);
    window.addEventListener('touchcancel', stopHold);
    window.addEventListener('mouseleave', stopHold);

    // Initialization
    const savedLang = (() => { try { return localStorage.getItem('siteLang') || 'pt'; } catch (e) { return 'pt'; } })();
    setLang(savedLang);
  </script>
  <script src="../nav.js"></script>
</body>

</html>
