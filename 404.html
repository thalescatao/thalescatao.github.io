<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script>
    if (window.location.protocol !== 'file:' && window.location.pathname.replace(/\\/g, '/').split('/').pop() !== '404.html') {
      document.write('<base href="/">');
    }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page not found • Thales Catão</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon/favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon/64x64.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/180x180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="global.css" />
  <style>
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 75vh;
      text-align: center;
      padding: 99px 24px 24px;
    }

    .error-code {
      font-family: var(--font-serif);
      font-size: 120px;
      font-weight: bold;
      line-height: 1;
      color: var(--accent);
      position: relative;
      animation: fadeUp 0.5s ease both, drift 0.5s 1.5s forwards;
    }

    @keyframes drift {
      0% {
        color: var(--accent);
        font-style: normal;
      }

      100% {
        color: var(--muted);
        font-style: italic;
        font-weight: 400;
      }
    }

    .error-title {
      font-family: var(--font-serif);
      font-size: 30px;
      color: var(--text);
      margin-top: 15px;
      animation: fadeUp 0.5s 0.1s ease both;
    }

    .error-desc {
      max-width: 285px;
      margin-top: 15px;
      line-height: 1.6;
      animation: fadeUp 0.5s 0.2s ease both;
    }

    .error-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 36px;
      animation: fadeUp 0.5s 0.3s ease both;
    }

    .error-actions .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: var(--accent);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      color: var(--bg);
      text-decoration: none;
      transition: background 0.4s, transform 0.2s;
    }

    .error-actions .btn-primary:hover {
      background: color-mix(in srgb, var(--accent) 80%, #fff);
      transform: translateY(-1px);
    }

    .error-actions .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: transparent;
      color: var(--text);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 400;
      text-decoration: none;
      border: 0.5px solid var(--muted);
      transition: background 0.4s, transform 0.2s;
    }

    .error-actions .btn-secondary:hover {
      background: var(--surface);
      transform: translateY(-1px);
    }

    footer {
      filter: grayscale(1);
    }
  </style>
</head>

<body>

  <div id="site-nav"></div>

  <div class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-title" data-k="404.title">Página não encontrada</h1>
    <p class="error-desc" data-k="404.desc">O endereço que tentou acessar não existe ou foi movido.</p>
    <div class="error-actions">
      <a class="btn-primary" href="index.html" data-route="home" data-k="404.btn1">Página Principal</a>
      <a class="btn-secondary" href="contact/index.html" data-route="contact" data-k="404.btn2">Fazer contato</a>
    </div>
  </div>

  <footer><span data-k="footer">Feito com 🧡 &middot; &copy; 2026 Thales Catão</span></footer>

  <script>
    window.pageTranslations = {
      pt: {
        '404.title': 'Página não encontrada',
        '404.desc': 'O endereço que tentou acessar não existe ou foi movido.',
        '404.btn1': 'Página Principal',
        '404.btn2': 'Fazer contato'
      },
      en: {
        '404.title': 'Page not found',
        '404.desc': 'The page you were looking for doesn\'t exist or has been moved.',
        '404.btn1': 'Go to homepage',
        '404.btn2': 'Get in touch'
      }
    };
  </script>
  <script src="nav.js"></script>
</body>

</html>
